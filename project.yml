name: Hypogeum
options:
  bundleIdPrefix: com.hypogeum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Alamofire:
    url: https://github.com/rg8tv2gc29-tech/Alamofire
    revision: 3ea8e93ec37a3ae5f255afb529ef20f438dd1903
  swift-collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.1.4
targets:
  Hypogeum:
    type: application
    platform: iOS
    sources:
      - path: Hypogeum
        excludes:
          - Store/SQLite3.modulemap
    resources:
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: swift-collections
        product: DequeModule
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hypogeum.shaft
        PRODUCT_NAME: Hypogeum
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Slotohype
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: This app does not use the camera.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        OTHER_LDFLAGS: $(inherited) -lsqlite3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  HypogeumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HypogeumTests
    dependencies:
      - target: Hypogeum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hypogeum.shaft.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hypogeum.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hypogeum"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Hypogeum:
    build:
      targets:
        Hypogeum: all
        HypogeumTests: [test]
    test:
      targets:
        - HypogeumTests
